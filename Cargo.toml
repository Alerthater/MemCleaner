[package]
name = "memcleaner"
version = "1.0.0"
edition = "2021"
description = "极简、低占用的 Windows 内存清理工具：Rust 独立实现的系统级内存清理，Win32 自绘 UI"
license = "MIT"
repository = "https://github.com/Alerthater/MemCleaner"
homepage = "https://github.com/Alerthater/MemCleaner"
authors = ["Alerthater"]

[[bin]]
name = "MemCleaner"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
